name: Screenshots

# Builds the app for the iPhone simulator, opens each screen with sample data
# (the app's design preview mode, Debug builds only) and saves screenshots.
# Download them from the run's "screenshots" artifact.
on:
  workflow_dispatch:
    inputs:
      screens:
        description: Only these screens, in light mode (space separated). Leave empty for all.
        required: false
        default: ""

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -viE "beta|_rc" | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project LittleLog.xcodeproj \
            -scheme LittleLog \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Take screenshots
        timeout-minutes: 45
        env:
          ONLY: ${{ inputs.screens }}
        run: |
          brew install coreutils > /dev/null
          t() { gtimeout "$@" || echo "  (timed out or failed: $*)"; }
          APP=build/Build/Products/Debug-iphonesimulator/LittleLog.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          mkdir -p shots
          # Simulators for the newest installed iOS runtime only.
          runtime=$(xcrun simctl list runtimes available | grep -E "^iOS" | tail -1 | sed -E 's/.* - (com\.apple[^ ]+).*/\1/')
          echo "Runtime: $runtime"
          devices=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices'].get('$runtime',[]); print('\n'.join(x['name']+'|'+x['udid'] for x in d if x['name'].startswith('iPhone')))")
          echo "$devices"
          big=$(echo "$devices" | grep -E "Pro Max" | tail -1)
          small=$(echo "$devices" | grep -E "iPhone (SE|1[0-9]e|1[0-9] mini)" | tail -1)
          [ -z "$small" ] && small=$(echo "$devices" | grep -vE "Pro|Plus|Air" | tail -1)
          # Show the sample data in late afternoon local time, so "today" looks lived-in.
          utc_hour=$(date -u +%H); offset=$(( (10#$utc_hour - 17 + 24) % 24 )); [ $offset -gt 12 ] && offset=$((offset - 24))
          if [ $offset -ge 0 ]; then zone="Etc/GMT+$offset"; else zone="Etc/GMT$offset"; fi
          echo "Time zone for screenshots: $zone"
          export SIMCTL_CHILD_TZ="$zone"
          screens="today today-report today-timeline trends trends-growth photos family feed tummy diaper growth milestone appointments newAppointment signin report report-log sleep vaccines"
          for pick in "$big" "$small"; do
            name=$(echo "${pick%%|*}" | tr ' ' '-')
            udid="${pick##*|}"
            [ -z "$udid" ] && continue
            echo "::group::$name"
            date; echo "Booting"
            t 300 xcrun simctl boot "$udid"
            t 1200 xcrun simctl bootstatus "$udid" -b | tail -2
            date; echo "Booted"
            t 30 xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
            t 120 xcrun simctl install "$udid" "$APP"
            shoot() {
              echo "  $2 $1"
              t 30 xcrun simctl launch --terminate-running-process "$udid" "$BUNDLE" -designPreview -screen "$1" > /dev/null
              sleep 5
              t 30 xcrun simctl io "$udid" screenshot "shots/$name-$2-$1.png" > /dev/null 2>&1
            }
            t 30 xcrun simctl ui "$udid" appearance light
            # The first launch after installing is slow; warm up before taking pictures.
            t 60 xcrun simctl launch "$udid" "$BUNDLE" -designPreview -screen today > /dev/null
            sleep 20
            if [ -n "$ONLY" ]; then
              for s in $ONLY; do shoot "$s" light; done
              t 60 xcrun simctl shutdown "$udid"
              echo "::endgroup::"
              continue
            fi
            for s in $screens; do shoot "$s" light; done
            t 30 xcrun simctl ui "$udid" appearance dark
            for s in today today-report trends feed appointments; do shoot "$s" dark; done
            t 30 xcrun simctl ui "$udid" appearance light
            t 30 xcrun simctl ui "$udid" content_size extra-extra-large
            for s in today today-report feed appointments newAppointment; do shoot "$s" bigtext; done
            t 30 xcrun simctl ui "$udid" content_size large
            t 60 xcrun simctl shutdown "$udid"
            echo "::endgroup::"
          done
          ls shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
