name: Send to TestFlight

# Run this from the Actions tab ("Send to TestFlight" > "Run workflow").
# It builds the app on a cloud Mac, signs it using your App Store Connect API
# key and uploads it to App Store Connect, where it appears in TestFlight.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::A GitHub secret is missing for $name (see README, 'Connect GitHub to Apple')."; missing=1; fi
          done
          if [ ! -f LittleLog/GoogleService-Info.plist ]; then echo "::error::LittleLog/GoogleService-Info.plist is missing (see README, 'Firebase')."; missing=1; fi
          exit $missing

      - name: Read app settings
        run: |
          echo "BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' LittleLog/GoogleService-Info.plist)" >> "$GITHUB_ENV"
          echo "REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' LittleLog/GoogleService-Info.plist)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/signing/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/signing/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "P12_PASSWORD=$(uuidgen)" >> "$GITHUB_ENV"

      - name: Create signing certificate and profile
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          OUT_DIR="$RUNNER_TEMP/signing" "$RUNNER_TEMP/venv/bin/python" scripts/appstore_signing.py

      - name: Install certificate and profile
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/signing/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and sign
        run: |
          set -o pipefail
          echo "Building $BUNDLE_ID, build number ${{ github.run_number }}"
          xcodebuild archive \
            -project LittleLog.xcodeproj \
            -scheme LittleLog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LittleLog.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            APP_TEAM_ID="$TEAM_ID" \
            APP_BUNDLE_ID="$BUNDLE_ID" \
            REVERSED_CLIENT_ID="$REVERSED_CLIENT_ID" \
            APP_SIGN_STYLE=Manual \
            APP_SIGN_IDENTITY="Apple Distribution" \
            APP_PROFILE="$PROFILE_NAME" \
            APS_ENVIRONMENT=production \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to TestFlight
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LittleLog.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Uploaded build ${{ github.run_number }}. It appears in App Store Connect > TestFlight once Apple finishes processing it."

      - name: Clean up keys
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/signing"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
